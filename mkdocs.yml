site_name: AgroTech Robotics Challenge
site_description: >-
  Республиканское соревнование по робототехнике и искусственному интеллекту
  на платформах Unitree Go2 и Unitree G1. New Uzbekistan University.
site_author: NewUU Engineering
site_url: https://newuu-engineering.github.io/unitree-contest/

repo_url: https://github.com/NewUU-engineering/unitree-contest
repo_name: NewUU-engineering/unitree-contest
edit_uri: edit/main/docs/

# Contributor note at docs/README.md — not part of the published site
exclude_docs: |
  README.md

copyright: New Uzbekistan University · School of Engineering

theme:
  name: material
  custom_dir: overrides
  language: ru
  # No `logo:` — the brand mark is drawn as ::before on the header title
  # (newuu.css). assets/newuu-mark.svg is kept for social cards / favicon use.
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Переключить тему
    - media: "(prefers-color-scheme: light)"
      scheme: newuu
      toggle:
        icon: material/brightness-7
        name: Переключить тему
    - media: "(prefers-color-scheme: dark)"
      scheme: newuu-dark
      toggle:
        icon: material/brightness-4
        name: Переключить тему
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - toc.follow
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - content.tooltips
    - search.suggest
    - search.highlight
    # navigation.instant is OFF: it breaks the i18n language switcher

extra_css:
  - stylesheets/newuu.css
  - stylesheets/course.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/NewUU-engineering
      name: NewUU Engineering on GitHub
    - icon: fontawesome/solid/envelope
      link: mailto:robotics@newuu.uz
      name: Contact the organisers

nav:
  - Главная: index.md
  - Соревнование:
      - Этапы: stages.md
      - Треки:
          - tracks/index.md
          - Трек 1 — Unitree Go2: tracks/go2.md
          - Трек 2 — Unitree G1: tracks/g1.md
      - Регистрация: registration.md
      - Регламент: rules.md
      - Оценка решений: scoring.md
  - Технологии:
      - Стек: stack.md
      - Starter Kit: starter-kit.md
      - Быстрый старт: quickstart.md
      - Обучающие материалы: learn.md
      - Обучение моделей: training-models.md
  - FAQ: faq.md

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Ссылка на раздел
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys:
      key_map:
        l1: "L1"
        l2: "L2"
        r1: "R1"
        r2: "R2"
        start: "START"
        select: "SELECT"
        home: "HOME"
        dpad-up: "D-pad ↑"
        dpad-down: "D-pad ↓"
        dpad-left: "D-pad ←"
        dpad-right: "D-pad →"
        stick-left: "Left stick"
        stick-right: "Right stick"
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search:
      lang:
        - ru
        - en
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: ru
          default: true
          name: Русский
          build: true
          link: /
          site_name: AgroTech Robotics Challenge
          site_description: >-
            Республиканское соревнование по робототехнике и искусственному
            интеллекту на платформах Unitree Go2 и Unitree G1.
          theme:
            language: ru
          copyright: New Uzbekistan University · Инженерная школа
        - locale: en
          name: English
          build: true
          link: /en/
          site_name: AgroTech Robotics Challenge
          site_description: >-
            National robotics and AI competition on Unitree Go2 and G1
            platforms. New Uzbekistan University.
          theme:
            language: en
            palette:
              - media: "(prefers-color-scheme)"
                toggle:
                  name: Switch theme
              - media: "(prefers-color-scheme: light)"
                toggle:
                  name: Switch theme
              - media: "(prefers-color-scheme: dark)"
                toggle:
                  name: Switch theme
          copyright: New Uzbekistan University · School of Engineering
          nav_translations:
            Главная: Home
            Соревнование: Competition
            Этапы: Stages
            Треки: Tracks
            Трек 1 — Unitree Go2: Track 1 — Unitree Go2
            Трек 2 — Unitree G1: Track 2 — Unitree G1
            Регистрация: Registration
            Регламент: Rules
            Оценка решений: Scoring
            Технологии: Technology
            Стек: Stack
            Starter Kit: Starter Kit
            Быстрый старт: Quick start
            Обучающие материалы: Learning resources
            Обучение моделей: Model training
            FAQ: FAQ

validation:
  omitted_files: warn
  # Language-switcher buttons use / and /en/ on purpose
  absolute_links: ignore
  unrecognized_links: warn
  anchors: warn
